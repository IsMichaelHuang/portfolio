# =============================================================================
# Deploy to GitHub Pages
# =============================================================================
#
# Runs the CI workflow, then builds the portfolio and deploys it to GitHub
# Pages. Fetches pinned repo data from the GitHub API at build time so the
# Projects section stays in sync without manual edits.
#
# Triggers:
#   push to main       — deploy after every merge
#   schedule (daily)   — refresh pinned repo data even without code changes
#   workflow_dispatch  — manual "Run workflow" button in the Actions tab
#
# Jobs:
#   ci         — calls ci.yml (lint, build, unit, e2e, limits)
#   deploy     — needs ci; fetch pinned repos, build, publish to Pages.
#                The only job allowed to write to Pages.
#   keepalive  — schedule only; keeps the schedule from being disabled
#
# Node comes from .nvmrc (24), which runs scripts/*.ts directly.
#
# Prerequisites:
#   - GitHub Pages source must be set to "GitHub Actions" in repo settings
#     (Settings → Pages → Source → GitHub Actions)
#   - No additional secrets required — GITHUB_TOKEN is auto-generated
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Run daily at midnight UTC to refresh project data
    - cron: "0 0 * * *"
  workflow_dispatch:

# Default token is read-only; each job below asks for what it needs.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # If a new deploy starts while one is in progress, cancel the old one so
    # a stale build never overwrites a newer deployment.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Queries the GitHub GraphQL API for pinned repos and writes them to
      # src/data/projects.ts.
      - name: Fetch pinned repos
        run: node scripts/fetch-pinned.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Setup Pages
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        # actions/upload-pages-artifact v5.0.0
        # Quoted and split only to stay within 80 columns.
        uses: "actions/upload-pages-artifact@\
          fc324d3547104276b827a68afc52ff2a11cc49c9"
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  # GitHub disables scheduled workflows in public repos after 60 days
  # without repository activity. This API call re-enables the workflow,
  # resetting that clock; it mirrors the API mode of the keepalive-workflow
  # action without a third-party dependency. It must not depend on other
  # jobs, so a failing CI run cannot stop it. If it ever stops working, run
  # the manual command in the README ("Deployment").
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflow
        run: >-
          gh api -X PUT
          "repos/$REPO/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
